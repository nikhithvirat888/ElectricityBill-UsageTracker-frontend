<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Bill | Electricity Tracker</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="nav"></div><main class="container">
<h1 id="title">Add Bill</h1><div id="msg" class="msg"></div>
<div class="card"><form id="f" novalidate>
 <div class="row">
  <div><label>Consumer number</label><input id="consumer" readonly></div>
  <div><label>Bill date</label><input name="billDate" type="date"><div class="field-error" data-err="billDate"></div></div>
  <div><label>Bill status</label><select name="status"><option value="UNPAID">Unpaid</option><option value="PAID">Paid</option><option value="OVERDUE">Overdue</option></select><div class="field-error" data-err="status"></div></div>
 </div>
 <div class="row">
  <div><label>Previous reading</label><input name="previousReading" type="number" step="0.01" min="0"><div class="field-error" data-err="previousReading"></div></div>
  <div><label>Current reading</label><input name="currentReading" type="number" step="0.01" min="0"><div class="field-error" data-err="currentReading"></div></div>
  <div><label>Units consumed</label><input id="units" readonly value="0"></div>
  <div><label>Bill amount (₹)</label><input name="billAmount" type="number" step="0.01" min="0"><div class="field-error" data-err="billAmount"></div></div>
 </div>
 <button class="btn" type="submit" id="saveBtn">Save bill</button>
 <a class="btn ghost" style="display:inline-block;text-decoration:none;padding:.6rem 1.2rem" href="history.html">Cancel</a>
</form></div></main>
<script src="js/app.js"></script>
<script>
requireAuth(); renderNav("add-bill");
const f = document.getElementById("f");
const editId = new URLSearchParams(location.search).get("id");
const calc = () => { const u = Number(f.currentReading.value) - Number(f.previousReading.value); units.value = (f.currentReading.value !== "" && u >= 0) ? u.toFixed(2) : (u < 0 ? "Invalid" : "0"); };
f.currentReading.addEventListener("input", calc); f.previousReading.addEventListener("input", calc);

(async () => {
  try {
    const me = await api("/profile"); consumer.value = me.consumerNumber || "";
    if (editId) {
      title.textContent = "Edit Bill"; saveBtn.textContent = "Update bill";
      const b = await api("/bills/" + editId);
      ["previousReading", "currentReading", "billAmount", "billDate", "status"].forEach(k => f[k].value = b[k]);
    } else {
      f.billDate.value = today();
      f.previousReading.value = (await api("/meter/latest")).previousReading;
    }
    calc();
  } catch (e) { showMsg(e.message, false); }
})();

f.addEventListener("submit", async e => {
  e.preventDefault();
  const data = validate(f, {
    previousReading: [R.nonNegative("Previous reading")],
    currentReading: [R.required("Current reading"), R.positive("Current reading"), R.notLower("previousReading", "currentReading")],
    billAmount: [R.required("Bill amount"), R.positive("Bill amount")],
    billDate: [R.required("Bill date")], status: [R.required("Status")]
  });
  if (!data) return;
  const body = { previousReading: +data.previousReading, currentReading: +data.currentReading, billAmount: +data.billAmount, billDate: data.billDate, status: data.status };
  try {
    await api(editId ? "/bills/" + editId : "/bills", editId ? "PUT" : "POST", body);
    showMsg(editId ? "Bill updated" : "Bill saved");
    setTimeout(() => location.href = "history.html", 900);
  } catch (err) { showErrors(err, f); }
});
</script></body></html>
